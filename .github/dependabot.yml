# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Root package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 8
    groups:
      glob-related:
        patterns:
          - "minimatch"
          - "glob"
          - "brace-expansion"
          - "picomatch"
          - "micromatch"
          - "fast-glob"

  # Firebase Functions package.json
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 8
    groups:
      glob-related:
        patterns:
          - "minimatch"
          - "glob"
          - "brace-expansion"
          - "picomatch"
          - "micromatch"
          - "fast-glob"
